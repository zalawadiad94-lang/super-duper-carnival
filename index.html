<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Pulse — Live Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Market Pulse</h1>
    <p class="subtitle">Live quotes, charts &amp; news powered by TradingView</p>
  </header>

  <!-- Scrolling ticker tape -->
  <div class="tradingview-widget-container ticker-tape">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
      "symbols": [
        { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500" },
        { "proName": "FOREXCOM:NSXUSD", "title": "Nasdaq 100" },
        { "proName": "FOREXCOM:DJI", "title": "Dow 30" },
        { "proName": "FX_IDC:EURUSD", "title": "EUR/USD" },
        { "proName": "BITSTAMP:BTCUSD", "title": "Bitcoin" },
        { "proName": "BITSTAMP:ETHUSD", "title": "Ethereum" },
        { "proName": "NASDAQ:AAPL", "title": "Apple" },
        { "proName": "NASDAQ:NVDA", "title": "Nvidia" }
      ],
      "showSymbolLogo": true,
      "isTransparent": false,
      "displayMode": "adaptive",
      "colorTheme": "dark",
      "locale": "en"
    }
    </script>
  </div>

  <main class="dashboard-grid">
    <!-- Main live chart -->
    <section class="panel chart-panel">
      <h2>Live Chart</h2>
      <div class="tradingview-widget-container">
        <div id="tv_chart"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "NASDAQ:AAPL",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#131722",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "hide_side_toolbar": false,
            "withdateranges": true,
            "container_id": "tv_chart"
          });
        </script>
      </div>
    </section>

    <!-- Market overview sidebar -->
    <aside class="panel overview-panel">
      <h2>Market Overview</h2>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
        {
          "colorTheme": "dark",
          "dateRange": "12M",
          "showChart": true,
          "locale": "en",
          "width": "100%",
          "height": "100%",
          "largeChartUrl": "",
          "isTransparent": false,
          "showSymbolLogo": true,
          "showFloatingTooltip": false,
          "plotLineColorGrowing": "rgba(41, 98, 255, 1)",
          "plotLineColorFalling": "rgba(41, 98, 255, 1)",
          "gridLineColor": "rgba(240, 243, 250, 0)",
          "scaleFontColor": "rgba(219, 219, 219, 1)",
          "belowLineFillColorGrowing": "rgba(41, 98, 255, 0.12)",
          "belowLineFillColorFalling": "rgba(41, 98, 255, 0.12)",
          "belowLineFillColorGrowingBottom": "rgba(41, 98, 255, 0)",
          "belowLineFillColorFallingBottom": "rgba(41, 98, 255, 0)",
          "symbolActiveColor": "rgba(41, 98, 255, 0.12)",
          "tabs": [
            {
              "title": "Indices",
              "symbols": [
                { "s": "FOREXCOM:SPXUSD", "d": "S&P 500" },
                { "s": "FOREXCOM:NSXUSD", "d": "Nasdaq 100" },
                { "s": "FOREXCOM:DJI", "d": "Dow 30" },
                { "s": "INDEX:NKY", "d": "Nikkei 225" }
              ]
            },
            {
              "title": "Forex",
              "symbols": [
                { "s": "FX_IDC:EURUSD", "d": "EUR/USD" },
                { "s": "FX_IDC:GBPUSD", "d": "GBP/USD" },
                { "s": "FX_IDC:USDJPY", "d": "USD/JPY" }
              ]
            },
            {
              "title": "Crypto",
              "symbols": [
                { "s": "BITSTAMP:BTCUSD", "d": "Bitcoin" },
                { "s": "BITSTAMP:ETHUSD", "d": "Ethereum" },
                { "s": "COINBASE:SOLUSD", "d": "Solana" }
              ]
            }
          ]
        }
        </script>
      </div>
    </aside>

    <!-- Live news / market pulse feed -->
    <section class="panel news-panel">
      <h2>News &amp; Market Pulse</h2>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
        {
          "feedMode": "all_symbols",
          "colorTheme": "dark",
          "isTransparent": false,
          "displayMode": "regular",
          "width": "100%",
          "height": "100%",
          "locale": "en"
        }
        </script>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Data provided live by TradingView widgets — no API key required. Change the chart symbol using the search box on the chart panel.</p>
  </footer>
</body>
</html>
