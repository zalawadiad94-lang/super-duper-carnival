plugins {
    id "com.android.application"
}

// Optional Gradle build (needs the Android SDK). scripts/build-apk.sh builds the
// same app without Gradle; both package the web bundle from `npm run build:apk-web`.
android {
    namespace "com.sitekhata.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.sitekhata.app"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "2.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
